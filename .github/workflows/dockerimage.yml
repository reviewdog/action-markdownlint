name: Docker Image CI

on: [push]

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the Docker image
        run: docker build --file Dockerfile --tag "action-markdownlint:$(date +%s)" .
